buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.github.johnrengelman:shadow:8.1.1"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:$assetPipelineVersion"
        classpath "com.bertramlabs.plugins:jsx-asset-pipeline:$assetPipelineVersion"
    }
}

apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'asset-pipeline'

group = 'com.morpheuslab'
version = '0.1.43'

java {
    // build on JDK 17, target 11: the appliance classloader rejects 17 bytecode
    sourceCompatibility = JavaVersion.toVersion('1.11')
    targetCompatibility = JavaVersion.toVersion('1.11')
}

repositories {
    mavenLocal()
    mavenCentral()
}

configurations { provided }

dependencies {
    provided "com.morpheusdata:morpheus-plugin-api:$morphPluginApiVersion"
    provided "org.codehaus.groovy:groovy-all:$groovyVersion"
    provided "javax.servlet:javax.servlet-api:3.1.0"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.yaml:snakeyaml:2.2"
    implementation("org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r") { exclude group: 'org.slf4j' }
    testImplementation "org.spockframework:spock-core:$spockVersion"
}

// Helm is packed into the jar so charts can be turned into YAML offline. Downloaded once and checked.
def helmVersion = 'v4.3.0'
def helmSha256 = '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb'
def helmDir = file('helm-res')
tasks.register('fetchHelm') {
    outputs.dir helmDir
    onlyIf { !new File(helmDir, 'helm/linux-amd64/helm').exists() || new File(helmDir, 'helm/VERSION').text.trim() != helmVersion }
    doLast {
        File tgz = new File(temporaryDir, 'helm.tgz')
        ant.get(src: "https://get.helm.sh/helm-${helmVersion}-linux-amd64.tar.gz", dest: tgz)
        String sum = java.security.MessageDigest.getInstance('SHA-256').digest(tgz.bytes).encodeHex().toString()
        if (sum != helmSha256) throw new GradleException("Helm download checksum does not match: ${sum}")
        delete helmDir
        copy { from(tarTree(resources.gzip(tgz))) { include 'linux-amd64/helm' }; into new File(helmDir, 'helm') }
        copy { from(tarTree(resources.gzip(tgz))) { include 'linux-amd64/LICENSE' }; into new File(helmDir, 'helm'); eachFile { it.path = 'LICENSE' } }
        new File(helmDir, 'helm/VERSION').text = helmVersion
    }
}
processResources.dependsOn 'fetchHelm'

sourceSets {
    main {
        compileClasspath += configurations.provided
        resources.srcDir 'helm-res'   // filled by fetchHelm, not in git
    }
    test {
        compileClasspath += configurations.provided
        runtimeClasspath += configurations.provided
    }
}

test { useJUnitPlatform() }

jar {
    manifest {
        attributes(
            'Plugin-Class': 'com.morpheuslab.layoutstudio.LayoutStudioPlugin',
            'Plugin-Version': archiveVersion.get(),
            'Morpheus-Name': 'HKS Layout Studio',
            'Morpheus-Organization': 'morpheuslab',
            'Morpheus-Code': 'hks-layout-studio',
            'Morpheus-Description': 'Back up and restore cluster layouts. Works offline.',
            'Morpheus-Labels': 'Plugin,Kubernetes,Layouts,Backup',
            'Morpheus-Min-Appliance-Version': '8.0.0'
        )
    }
}

assets { packagePlugin = false }

shadowJar {
    archiveClassifier.set('all')
    // own copy of SnakeYAML, renamed so it never clashes with the appliance's
    relocate 'org.yaml.snakeyaml', 'com.morpheuslab.layoutstudio.shaded.snakeyaml'
    relocate 'org.eclipse.jgit', 'com.morpheuslab.layoutstudio.shaded.jgit'
    relocate 'com.googlecode.javaewah', 'com.morpheuslab.layoutstudio.shaded.javaewah'
    relocate 'org.apache.commons.codec', 'com.morpheuslab.layoutstudio.shaded.codec'
    exclude 'assets/webjars/**'
}
tasks.assemble.dependsOn tasks.shadowJar
